<div class="card">
  <div class="card-header">
    <div class="id">ID: <span style="color:#eaeaea;">{id}</span></div>
    <div class="status">{status}</div>
  </div>

  <div class="grid">
    <div>
      <div class="field" style="display:flex; align-items:center;">
        <img src="icons/person.svg" width="20" height="20" alt="" style="margin-right:8px;">

        <div>
          <div class="label">ФИО клиента</div>
          <div class="value">{client_full_name}</div>
        </div>
      </div>

      <div class="field" style="display:flex; align-items:center;">
        <img src="icons/phone.svg" width="20" height="20" alt="" style="margin-right:8px;">

        <div>
          <div class="label">Телефон</div>
          <div class="value">{phone_number}</div>
        </div>
      </div>

      <div class="field" style="display:flex; align-items:center;">
        <img src="icons/mail.svg" width="20" height="20" alt="" style="margin-right:8px;">

        <div>
          <div class="label">Email</div>
          <div class="value">{email}</div>
        </div>
      </div>
    </div>

    <div>
      <div class="field" style="display:flex; align-items:center;">
        <img src="icons/brand.svg" width="20" height="20" alt="" style="margin-right:8px;">

        <div>
          <div class="label">Марка автомобиля</div>
          <div class="value">{car_brand_name}</div>
        </div>
      </div>

      <div class="field" style="display:flex; align-items:center;">
        <img src="icons/car.svg" width="20" height="20" alt="" style="margin-right:8px;">

        <div>
          <div class="label">Модель автомобиля</div>
          <div class="value">{car_model}</div>
        </div>
      </div>

      <div class="field" style="display:flex; align-items:center;">
        <img src="icons/tool.svg" width="20" height="20" alt="" style="margin-right:8px;">

        <div>
          <div class="label">Оказанная услуга</div>
          <div class="value">{service_provided}</div>
        </div>
      </div>

      <div class="field" style="display:flex; align-items:center;">
        <img src="icons/calendar.svg" width="20" height="20" alt="" style="margin-right:8px;">

        <div>
          <div class="label">Дата визита</div>
          <div class="value">{visit_date}</div>
        </div>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="grid">
    <div class="field" style="display:flex; align-items:center;">
      <img src="icons/person.svg" width="20" height="20" alt="" style="margin-right:8px;">

      <div>
        <div class="label">ФИО мастера</div>
        <div class="value">{master_full_name}</div>
      </div>
    </div>

    <div class="field" style="display:flex; align-items:center;">
      <img src="icons/comment.svg" width="20" height="20" alt="" style="margin-right:8px;">

      <div>
        <div class="label">Комментарий</div>
        <div class="value">{comment}</div>
      </div>
    </div>
  </div>
</div>
